    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1120" />
    <meta name="color-scheme" content="light dark" />
    <title>ScamLens — explainable scam risk analyzer</title>
    <meta
      name="description"
      content="Paste a suspicious message, email, SMS or URL. ScamLens estimates the risk and explains every warning. Runs entirely in your browser."
    />
    <script>
      // Apply the saved theme before first paint so there is no flash of light
      // theme on load. Reads only the app's own settings key.
      (function () {
        try {
          var raw = window.localStorage.getItem('scamlens:v1');
          var theme = raw ? (JSON.parse(raw).settings || {}).theme : null;
          if (theme !== 'dark' && theme !== 'light') theme = null;
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          // Storage unavailable or corrupt: leave the default light theme.
        }
      })();
    </script>
